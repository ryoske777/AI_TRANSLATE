name: Build & Release EXE

# v로 시작하는 태그를 푸시하면 Windows 에서 exe 를 빌드하고
# 해당 태그의 GitHub 릴리스에 RO_Translator.exe 를 첨부한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # 수동 실행도 허용

permissions:
  contents: write       # 릴리스 생성/자산 업로드에 필요

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sync version.txt to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo -n "$TAG" > version.txt
            echo "version.txt = $TAG"
          fi

      - name: Build exe
        run: pyinstaller RO_Translator.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RO_Translator
          path: dist/RO_Translator.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RO_Translator.exe
          generate_release_notes: true
